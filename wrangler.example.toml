# Cloudflare Pages project: wba-hpp-testing  (https://wba-hpp-testing.pages.dev)
name = "wba-hpp-testing"
pages_build_output_dir = "./public"
compatibility_date = "2026-10-01"

# KV namespace that holds the athlete records.
# Replace the id below with the one printed by:
#   npx wrangler kv namespace create HPP_DATA
[[kv_namespaces]]
binding = "HPP_DATA"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
